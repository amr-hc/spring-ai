spring.application.name=amrai
tavily.api-key=${TAVILY_API_KEY}
tavily.max-results=5
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG
spring.ai.openai.api-key=${OPEN_AI_KEY}
server.port=8099
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Store chat memory on disk so it survives application restarts.
spring.datasource.url=jdbc:h2:file:./data/chat-memory
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


spring.docker.compose.stop.command=stop

spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=amr
spring.ai.vectorstore.qdrant.initialize-schema=true

